[project]
name = "uzex-data-agent-backend"
version = "1.0.0"
description = "UZEX Data Agent backend: strict, evidence-based analytics over the provided UZEX dataset"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires the imported PostgreSQL dataset",
  "evaluation: runs the 100-question evaluation set",
  "performance: measures latency, concurrency and restart behaviour",
]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*", "importer*"]

# Runtime resources are read from the installed package directory by
# ``pathlib.Path(__file__)``, so they must be present in the wheel.  Without
# this section ``pip install .`` ships only Python modules and the language
# resources raise FileNotFoundError at runtime.
[tool.setuptools.package-data]
app = [
  "language/*.json",
  "rag/knowledge/*.json",
  "agent/prompts/*.txt",
]
importer = ["*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
